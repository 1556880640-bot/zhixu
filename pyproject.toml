[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-cn"
version = "2.0.0"
description = "AI原生中文编程语言 - 用中文写AI代码"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["chinese-programming", "ai", "mcp", "nlp"]

[project.scripts]
ai-cn = "ai_cn:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_cn*"]
