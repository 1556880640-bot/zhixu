[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "zhixu"
version = "1.0.0"
description = "知序 - 中文编程语言。用中文写代码，与 AI 自然对话"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["chinese-programming", "zhixu", "zhongwen", "ai"]

[project.scripts]
zhixu = "zhixu:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zhixu*"]
